[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seaice-seg"
version = "0.2.0"
description = "Sea ice concentration, stage of development and floe size from Sentinel-1 SAR and AMSR2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tian Tian" }]
# Inference dependencies only. PyTorch is listed without an index: install the CPU
# build first (pip install torch --index-url https://download.pytorch.org/whl/cpu)
# to avoid pulling CUDA libraries on Linux.
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3.9",
]

[project.optional-dependencies]
train = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
seaice-predict = "seaice.predict:main"

[project.urls]
Repository = "https://github.com/reddytian/sea-ice-segmentation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
